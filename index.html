<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>spacelibre — God's Eye View</title>
  <!-- Raster fallbacks: Safari ignores an SVG apple-touch-icon and falls back to a
       screenshot of the page, so an installed app needs a real PNG. Regenerate
       these from the logo with `node scripts/generate-icons.mjs`. -->
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
  <!-- Listed after the PNG: browsers that use the last usable icon keep the SVG
       for the tab. It is the square framing, not /logo.svg: the horizontal
       mark is 2.5:1, and an icon slot takes squares, so it was cropped at both
       ends in the install prompt. -->
  <link rel="icon" type="image/svg+xml" href="/icons/logo-square.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#071424" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="spacelibre" />
  <!-- The palette is resolved before the stylesheets load, so the first
       painted frame (the loading screen) is already in the visitor's
       chosen colour rather than flashing the default. -->
  <script src="/palette-bootstrap.js"></script>
  <link rel="stylesheet" href="/style.css" />
  <!-- Fonts and icon glyphs are prepared by the installer and served locally.
       Glyph inventory and immutable download hashes: scripts/static-assets.json. -->
  <link rel="stylesheet" href="/local-fonts.css" />
</head>

</body>
</html>
